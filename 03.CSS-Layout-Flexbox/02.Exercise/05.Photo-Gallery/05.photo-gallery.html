    <title>Photo Gallery</title>
  </head>
  <body>
    <div class="row">
      <div class="photo-frame">
        <img src="./Images/image1.jpg" alt="mountain" />

    </div>

    <div class="row">
      <div class="photo-frame">
        <img src="./Images/image4.jpg" alt="lake" />

        <img src="./Images/image5.jpg" alt="ice" />

      </div>

      </div>

      <div class="photo-frame">
        <img src="./Images/image7.jpg" alt="rocky coastline" />

      </div>

        <img src="./Images/image8.jpg" alt="aerial view" />

      </div>

        <img src="./Images/image9.jpg" alt="skyscrapers" />
