<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./02.flex-order.css" />
    <title>Flex Order</title>
  </head>
  <body>
    <div class="layout">
      <header>Header</header>

      <div class="content-wrapper">
        <main>Main content</main>
        <aside>Sidebar</aside>
      </div>

      <footer>Side footer</footer>
    </div>

    <div class="layout reverse-layout">
      <header>Header</header>

      <div class="content-wrapper">
        <aside>Sidebar</aside>
        <main>Main content</main>
      </div>

      <footer>Side footer</footer>
    </div>
  </body>
</html>
